name: One-shot Dart Format

on:
  push:
    branches:
      - fix/s6-exact-dart-format

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply exact Dart formatter
        shell: bash
        run: |
          dart format test/application/critical_user_flow_test.dart test/data/database/performance_indexes_test.dart
          if git diff --quiet -- test/application/critical_user_flow_test.dart test/data/database/performance_indexes_test.dart; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/application/critical_user_flow_test.dart test/data/database/performance_indexes_test.dart
          git commit -m "fix: apply exact dart formatter output"
          git push origin HEAD:fix/s6-exact-dart-format
