name: One-shot Stage Format Repro

on:
  push:
    branches:
      - fix/s6-stage-format-repro

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart run drift_dev make-migrations
      - run: >-
          dart run drift_dev schema generate
          --data-classes
          --companions
          drift_schemas/app_database/
          test/drift/generated_migrations/

      - name: Apply formatter after Stage preparation
        shell: bash
        run: |
          dart format test/application/critical_user_flow_test.dart
          if git diff --quiet -- test/application/critical_user_flow_test.dart; then
            echo "No formatting changes required."
            exit 0
          fi
          git diff -- test/application/critical_user_flow_test.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/application/critical_user_flow_test.dart
          git commit -m "fix: format critical flow after stage preparation"
          git push origin HEAD:fix/s6-stage-format-repro
