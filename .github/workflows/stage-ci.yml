name: Stage CI

on:
  push:
    branches:
      - stage
  pull_request:
    branches:
      - stage
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promotion:
    name: Stage promotion gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require dev as source branch
        shell: bash
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "stage accepts promotion only from dev."
            echo "Current source: ${{ github.head_ref }}"
            exit 1
          fi

  security:
    name: Stage security
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          cache: true
          timeout: 5m

  prepare:
    name: Stage generated code
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect schema-sensitive changes
        id: changes
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
            echo "Workflow dispatch: migration verification forced."
            exit 0
          fi

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            changed="$(git diff --name-only "$base" "$head")"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || printf '%s' "$before" | grep -Eq '^0+$'; then
              changed="$(git show --pretty='' --name-only "$GITHUB_SHA")"
            else
              changed="$(git diff --name-only "$before" "$GITHUB_SHA")"
            fi
          fi

          printf '%s\n' "$changed"

          if printf '%s\n' "$changed" |
            grep -Eq '^(lib/src/data/database/|drift_schemas/|pubspec\.yaml$|pubspec\.lock$)'; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore generated Dart cache
        id: codegen-cache
        uses: actions/cache@v6
        with:
          path: .stage-cache
          key: ${{ format('stage-codegen-v2-{0}-{1}', runner.os, hashFiles('lib/src/data/database/*.dart', 'lib/src/data/database/**/*.dart', 'drift_schemas/**/*.json', 'pubspec.yaml', 'pubspec.lock')) }}

      - name: Set up Flutter for cache miss or migration verification
        if: steps.codegen-cache.outputs.cache-hit != 'true' || steps.changes.outputs.migrations == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies for preparation
        if: steps.codegen-cache.outputs.cache-hit != 'true' || steps.changes.outputs.migrations == 'true'
        run: flutter pub get

      - name: Verify Android path provider compatibility pin for preparation
        if: steps.codegen-cache.outputs.cache-hit != 'true' || steps.changes.outputs.migrations == 'true'
        shell: bash
        run: |
          flutter pub deps --style=compact | grep -F 'path_provider_android 2.2.23'
          if flutter pub deps --style=compact | grep -Eq 'path_provider_android 2\.3\.'; then
            echo "JNI-based path_provider_android must not be used on Android release builds."
            exit 1
          fi

      - name: Generate Drift code once
        if: steps.codegen-cache.outputs.cache-hit != 'true'
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate Drift migrations
        if: steps.changes.outputs.migrations == 'true'
        run: dart run drift_dev make-migrations

      - name: Verify Drift migration artifacts are committed
        if: steps.changes.outputs.migrations == 'true'
        shell: bash
        run: |
          changes="$(git status --porcelain --untracked-files=all -- drift_schemas lib/src/data/database test/drift |
            grep -v 'test/drift/generated_migrations/' |
            grep -vE '\.(g|freezed)\.dart$' || true)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "Drift migration artifacts are not committed."
            exit 1
          fi

      - name: Generate Drift migration test helper
        if: steps.codegen-cache.outputs.cache-hit != 'true'
        run: >-
          dart run drift_dev schema generate
          --data-classes
          --companions
          drift_schemas/app_database/
          test/drift/generated_migrations/

      - name: Package generated Dart
        if: steps.codegen-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .stage-cache

          {
            find lib test -type f \( -name '*.g.dart' -o -name '*.freezed.dart' \) -print0
            find test/drift/generated_migrations -type f -print0
          } |
            sort -zu |
            xargs -0 -r sha256sum > .stage-cache/generated-code.sha256

          if [ ! -s .stage-cache/generated-code.sha256 ]; then
            echo "Generated Dart manifest is empty."
            exit 1
          fi

          cut -d' ' -f3- .stage-cache/generated-code.sha256 \
            | tr '\n' '\0' \
            | tar --null -czf .stage-cache/generated-code.tgz --files-from=-

      - name: Verify generated artifact integrity
        shell: bash
        run: |
          test -s .stage-cache/generated-code.tgz
          test -s .stage-cache/generated-code.sha256

          rm -rf /tmp/generated-code-check
          mkdir -p /tmp/generated-code-check
          tar -xzf .stage-cache/generated-code.tgz -C /tmp/generated-code-check
          (
            cd /tmp/generated-code-check
            sha256sum -c "$GITHUB_WORKSPACE/.stage-cache/generated-code.sha256"
          )

      - name: Upload generated Dart
        uses: actions/upload-artifact@v7
        with:
          name: stage-generated-dart-${{ github.sha }}
          path: .stage-cache/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  quality:
    name: Stage quality
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'dev')
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download generated Dart
        uses: actions/download-artifact@v8
        with:
          name: stage-generated-dart-${{ github.sha }}
          path: .stage-generated

      - name: Restore generated Dart
        shell: bash
        run: |
          tar -xzf .stage-generated/generated-code.tgz
          sha256sum -c .stage-generated/generated-code.sha256

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Android path provider compatibility pin
        shell: bash
        run: |
          flutter pub deps --style=compact | grep -F 'path_provider_android 2.2.23'
          if flutter pub deps --style=compact | grep -Eq 'path_provider_android 2\.3\.'; then
            echo "JNI-based path_provider_android must not be used on Android release builds."
            exit 1
          fi

      - name: Verify source formatting
        shell: bash
        run: |
          dart format lib test
          git diff --exit-code -- lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Enforce coverage baseline
        env:
          COVERAGE_BASELINE_PERCENT: "35.00"
        run: bash tool/check_coverage.sh coverage/lcov.info

      - name: Publish coverage summary
        if: always() && hashFiles('coverage/lcov.info') != ''
        shell: bash
        run: |
          total="$(awk -F: '/^LF:/{sum+=$2} END{print sum+0}' coverage/lcov.info)"
          hit="$(awk -F: '/^LH:/{sum+=$2} END{print sum+0}' coverage/lcov.info)"
          percent="$(awk -v hit="$hit" -v total="$total" 'BEGIN { if (total == 0) print "0.00"; else printf "%.2f", hit * 100 / total }')"

          {
            echo "## Test coverage"
            echo
            echo "- Lines hit: $hit"
            echo "- Lines found: $total"
            echo "- Line coverage: $percent%"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@v7
        with:
          name: stage-flutter-test-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  promotion-validation:
    name: Stage promotion validation
    if: always() && github.event_name == 'pull_request'
    needs:
      - promotion
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require promotion quality gates
        shell: bash
        run: |
          test "${{ needs.promotion.result }}" = "success"
          test "${{ needs.quality.result }}" = "success"

  android-release:
    name: Stage Android release
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download generated Dart
        uses: actions/download-artifact@v8
        with:
          name: stage-generated-dart-${{ github.sha }}
          path: .stage-generated

      - name: Restore generated Dart
        shell: bash
        run: |
          tar -xzf .stage-generated/generated-code.tgz
          sha256sum -c .stage-generated/generated-code.sha256

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Generate Android host project
        run: >-
          flutter create
          --platforms=android
          --project-name budget_accounting_system
          --org com.bekodeg
          --no-pub
          .

      - name: Install dependencies after Android host generation
        run: flutter pub get

      - name: Verify Android path provider compatibility pin
        shell: bash
        run: |
          flutter pub deps --style=compact | grep -F 'path_provider_android 2.2.23'
          if flutter pub deps --style=compact | grep -Eq 'path_provider_android 2\.3\.'; then
            echo "JNI-based path_provider_android must not be used on Android release builds."
            exit 1
          fi

      - name: Verify Android Flutter plugin registrant
        shell: bash
        run: |
          registrant="android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java"
          test -s "$registrant"
          grep -F 'PathProviderPlugin' "$registrant"
          grep -F 'FlutterSecureStoragePlugin' "$registrant"
          grep -F 'UrlLauncherPlugin' "$registrant"

      - name: Configure LAN platform permissions
        run: python3 tool/configure_lan_platform_permissions.py

      - name: Configure Android native library loading
        run: python3 tool/configure_android_native_library_loading.py

      - name: Configure ML Kit Android dependencies
        run: |
          python3 tool/configure_mlkit_android_dependencies.py
          grep -F 'com.google.mlkit:text-recognition-chinese:16.0.1' android/app/build.gradle.kts
          grep -F 'com.google.mlkit:text-recognition-devanagari:16.0.1' android/app/build.gradle.kts
          grep -F 'com.google.mlkit:text-recognition-japanese:16.0.1' android/app/build.gradle.kts
          grep -F 'com.google.mlkit:text-recognition-korean:16.0.1' android/app/build.gradle.kts

      - name: Restore Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ format('stage-gradle-{0}-{1}', runner.os, hashFiles('pubspec.lock', 'android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties')) }}
          restore-keys: |
            stage-gradle-${{ runner.os }}-

      - name: Validate Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        shell: bash
        run: |
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            ANDROID_CERT_SHA256; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Restore Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          keystore_path="$RUNNER_TEMP/budget-accounting-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Verify Android signing certificate
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        shell: bash
        run: |
          cert_output="$RUNNER_TEMP/android-signing-certificate.txt"
          keytool_error="$RUNNER_TEMP/android-signing-keytool-error.txt"

          if ! keytool -list -v \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            > "$cert_output" 2> "$keytool_error"; then
            if grep -Eqi 'password.*incorrect|tampered with|password was incorrect' "$keytool_error"; then
              echo "Android keystore password was rejected."
            elif grep -Eqi 'invalid keystore format|not a keystore' "$keytool_error"; then
              echo "Decoded Android keystore is invalid."
            elif grep -Eqi 'alias.*does not exist|alias.*not found' "$keytool_error"; then
              echo "Android key alias was not found in the keystore."
            else
              echo "Unable to inspect Android signing keystore with keytool."
            fi
            exit 1
          fi

          actual="$(
            awk -F': ' '/SHA256:/{if (value == "") value=$2} END{print value}' "$cert_output" |
              tr -d ':[:space:]' |
              tr '[:lower:]' '[:upper:]'
          )"
          expected="$(
            printf '%s' "$ANDROID_CERT_SHA256" |
              sed -E 's/^[[:space:]]*SHA256[[:space:]]*:[[:space:]]*//' |
              tr -d ':[:space:]' |
              tr '[:lower:]' '[:upper:]'
          )"

          if [ -z "$actual" ]; then
            echo "Unable to read SHA-256 fingerprint from the Android signing certificate."
            exit 1
          fi

          if [ "$actual" != "$expected" ]; then
            pretty_actual="$(printf '%s' "$actual" | sed 's/../&:/g; s/:$//')"
            echo "Android signing certificate SHA-256 does not match the pinned value."
            echo "Actual certificate SHA-256: $pretty_actual"
            exit 1
          fi

      - name: Configure Android release signing
        run: python3 tool/configure_android_release_signing.py

      - name: Verify Android native library compatibility settings
        shell: bash
        run: |
          grep -F 'android:extractNativeLibs="true"' android/app/src/main/AndroidManifest.xml
          grep -F 'useLegacyPackaging = true' android/app/build.gradle.kts

      - name: Prepare app build identity
        shell: bash
        run: |
          app_version="$(awk '$1 == "version:" {print $2; exit}' pubspec.yaml)"
          test -n "$app_version"
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "APP_CHANNEL=stage" >> "$GITHUB_ENV"
          echo "APP_COMMIT=${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"

      - name: Build signed Android release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          flutter build apk --release --no-pub
          --dart-define=APP_VERSION="$APP_VERSION"
          --dart-define=APP_CHANNEL="$APP_CHANNEL"
          --dart-define=APP_COMMIT="$APP_COMMIT"

      - name: Verify release APK and SQLCipher native assets
        shell: bash
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libsqlcipher.so'
          unzip -l "$apk" | grep -F 'lib/armeabi-v7a/libsqlcipher.so'
          unzip -l "$apk" | grep -F 'lib/x86_64/libsqlcipher.so'
          unzip -p "$apk" 'classes*.dex' | strings | grep -F 'PathProviderPlugin'
          unzip -p "$apk" 'classes*.dex' | strings | grep -F 'FlutterSecureStoragePlugin'
          unzip -p "$apk" 'classes*.dex' | strings | grep -F 'UrlLauncherPlugin'

      - name: Upload signed stage APK
        uses: actions/upload-artifact@v7
        with:
          name: stage-budget-accounting-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 3

  validate:
    name: Stage validation
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - security
      - prepare
      - quality
      - android-release
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require all stage gates
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          ANDROID_RESULT: ${{ needs['android-release'].result }}
        shell: bash
        run: |
          printf '%-18s %s\n' \
            "security" "$SECURITY_RESULT" \
            "generated-code" "$PREPARE_RESULT" \
            "quality" "$QUALITY_RESULT" \
            "android-release" "$ANDROID_RESULT"

          for result in \
            "$SECURITY_RESULT" \
            "$PREPARE_RESULT" \
            "$QUALITY_RESULT" \
            "$ANDROID_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "Stage gate failed."
              exit 1
            fi
          done
