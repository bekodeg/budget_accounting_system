name: Stage CI

on:
  push:
    branches:
      - stage
  pull_request:
    branches:
      - stage
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promotion:
    name: Stage promotion gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require dev as source branch
        shell: bash
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "stage accepts promotion only from dev."
            echo "Current source: ${{ github.head_ref }}"
            exit 1
          fi

  validate:
    name: Stage validation
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify generated code is reproducible
        shell: bash
        run: |
          find lib test -type f \( -name '*.g.dart' -o -name '*.freezed.dart' \) -print0 \
            | sort -z \
            | xargs -0 -r sha256sum > /tmp/codegen-before.sha256

          dart run build_runner build --delete-conflicting-outputs

          find lib test -type f \( -name '*.g.dart' -o -name '*.freezed.dart' \) -print0 \
            | sort -z \
            | xargs -0 -r sha256sum > /tmp/codegen-after.sha256

          diff -u /tmp/codegen-before.sha256 /tmp/codegen-after.sha256

      - name: Generate Drift migrations
        run: dart run drift_dev make-migrations

      - name: Generate Drift migration test helper
        run: >-
          dart run drift_dev schema generate
          --data-classes
          --companions
          drift_schemas/app_database/
          test/drift/generated_migrations/

      - name: Verify Drift migration artifacts are committed
        shell: bash
        run: |
          changes="$(git status --porcelain --untracked-files=all -- drift_schemas lib/src/data/database test/drift |
            grep -v 'test/drift/generated_migrations/' || true)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "Drift migration artifacts are not committed."
            exit 1
          fi

      - name: Verify source formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Publish coverage summary
        if: always() && hashFiles('coverage/lcov.info') != ''
        shell: bash
        run: |
          total="$(awk -F: '/^LF:/{sum+=$2} END{print sum+0}' coverage/lcov.info)"
          hit="$(awk -F: '/^LH:/{sum+=$2} END{print sum+0}' coverage/lcov.info)"
          percent="$(awk -v hit="$hit" -v total="$total" 'BEGIN { if (total == 0) print "0.00"; else printf "%.2f", hit * 100 / total }')"

          {
            echo "## Test coverage"
            echo
            echo "- Lines hit: $hit"
            echo "- Lines found: $total"
            echo "- Line coverage: $percent%"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@v7
        with:
          name: stage-flutter-test-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Generate Android host project
        run: >-
          flutter create
          --platforms=android
          --project-name budget_accounting_system
          --org com.bekodeg
          --no-pub
          .

      - name: Validate Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        shell: bash
        run: |
          for name in             ANDROID_KEYSTORE_BASE64             ANDROID_KEYSTORE_PASSWORD             ANDROID_KEY_ALIAS             ANDROID_KEY_PASSWORD             ANDROID_CERT_SHA256; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Restore Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          keystore_path="$RUNNER_TEMP/budget-accounting-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Verify Android signing certificate
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        shell: bash
        run: |
          actual="$(
            keytool -list -v               -keystore "$ANDROID_KEYSTORE_PATH"               -storepass "$ANDROID_KEYSTORE_PASSWORD"               -alias "$ANDROID_KEY_ALIAS"               | awk -F': ' '/SHA256:/{print $2; exit}'               | tr -d ':[:space:]'               | tr '[:lower:]' '[:upper:]'
          )"
          expected="$(
            printf '%s' "$ANDROID_CERT_SHA256"               | sed -E 's/^[[:space:]]*SHA256[[:space:]]*:[[:space:]]*//'               | tr -d ':[:space:]'               | tr '[:lower:]' '[:upper:]'
          )"

          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "Android signing certificate SHA-256 does not match the pinned value."
            exit 1
          fi

      - name: Configure Android release signing
        run: python3 tool/configure_android_release_signing.py

      - name: Build signed Android release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Verify release APK exists
        shell: bash
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload signed stage APK
        uses: actions/upload-artifact@v7
        with:
          name: stage-budget-accounting-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 3
