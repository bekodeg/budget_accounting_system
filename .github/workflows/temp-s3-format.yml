name: Temporary S3 formatter

on:
  push:
    branches:
      - fix/s3-stage-formatting

permissions:
  contents: read

jobs:
  format:
    name: Temporary Dart formatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true
      - name: Format S3 files and print diff
        shell: bash
        run: |
          dart format             lib/src/data/dal/category_account_dao.dart             lib/src/data/dal/plan_receipt_dao.dart             lib/src/data/repositories/drift_monthly_report_repository.dart             lib/src/domain/models/monthly_plan.dart             lib/src/domain/models/monthly_report.dart             lib/src/presentation/screens/monthly_plan_screen.dart             lib/src/presentation/screens/monthly_report_screen.dart             test/application/monthly_plan_use_cases_test.dart             test/data/repositories/account_balance_aggregation_test.dart             test/data/repositories/drift_monthly_report_repository_test.dart             test/presentation/monthly_plan_screen_test.dart             test/presentation/monthly_report_screen_test.dart             test/support/onboarding_fakes.dart
          git diff --             lib/src/data/dal/category_account_dao.dart             lib/src/data/dal/plan_receipt_dao.dart             lib/src/data/repositories/drift_monthly_report_repository.dart             lib/src/domain/models/monthly_plan.dart             lib/src/domain/models/monthly_report.dart             lib/src/presentation/screens/monthly_plan_screen.dart             lib/src/presentation/screens/monthly_report_screen.dart             test/application/monthly_plan_use_cases_test.dart             test/data/repositories/account_balance_aggregation_test.dart             test/data/repositories/drift_monthly_report_repository_test.dart             test/presentation/monthly_plan_screen_test.dart             test/presentation/monthly_report_screen_test.dart             test/support/onboarding_fakes.dart
