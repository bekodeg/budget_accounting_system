name: One-shot S4 analyzer fix

on:
  push:
    branches:
      - fix/s4-stage-analyze

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/s4-stage-analyze
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Apply Dart fixes
        run: dart fix --apply

      - name: Format Dart sources
        run: dart format lib test

      - name: Analyze fixed tree
        run: flutter analyze

      - name: Remove one-shot workflow
        run: rm .github/workflows/s4-stage-analyze.yml

      - name: Commit analyzer fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test .github/workflows/s4-stage-analyze.yml
          if git diff --cached --quiet; then
            echo "No analyzer fixes to commit."
            exit 0
          fi
          git commit -m "fix: resolve S4 analyzer issues"
          git push origin HEAD:fix/s4-stage-analyze
