name: One-shot Stage formatter

on:
  push:
    branches:
      - fix/s2-stage-formatting

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - run: flutter pub get

      - name: Format remaining S2 sources
        run: >-
          dart format
          lib/src/domain/models/transaction_draft.dart
          lib/src/presentation/screens/onboarding_screen.dart

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- lib/src/domain/models/transaction_draft.dart lib/src/presentation/screens/onboarding_screen.dart; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/domain/models/transaction_draft.dart lib/src/presentation/screens/onboarding_screen.dart
          git commit -m "style: match Stage formatter"
          git push origin "HEAD:fix/s2-stage-formatting"
