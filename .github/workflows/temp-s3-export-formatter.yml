name: Temporary S3 export formatter

on:
  push:
    branches:
      - fix/18-stage-formatting

permissions:
  contents: write

jobs:
  format:
    name: Temporary Dart formatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/18-stage-formatting
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true
      - name: Format and commit export files
        shell: bash
        run: |
          dart format \
            lib/src/application/use_cases/export_report.dart \
            lib/src/bootstrap/app_composition_root.dart \
            test/data/services/report_document_encoder_test.dart
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/src/application/use_cases/export_report.dart \
            lib/src/bootstrap/app_composition_root.dart \
            test/data/services/report_document_encoder_test.dart
          git commit -m "fix: format S3 export Dart sources"
          git push origin HEAD:fix/18-stage-formatting
