name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check source formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate Drift migration artifacts
        run: dart run drift_dev make-migrations

      - name: Upload Drift migration artifacts
        uses: actions/upload-artifact@v7
        with:
          name: drift-migration-artifacts
          path: |
            drift_schemas/
            test/drift/
            lib/src/data/database/*.steps.dart
          if-no-files-found: warn
          retention-days: 7

      - name: Verify Drift migration artifacts are committed
        run: git diff --exit-code -- drift_schemas test/drift lib/src/data/database

      - name: Analyze
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Write coverage summary
        shell: bash
        run: |
          coverage_percent="$(
            awk -F: '
              /^LF:/ { found += $2 }
              /^LH:/ { hit += $2 }
              END {
                if (found == 0) {
                  printf "0.00"
                } else {
                  printf "%.2f", (hit * 100.0) / found
                }
              }
            ' coverage/lcov.info
          )"
          {
            echo "### Test coverage"
            echo ""
            echo "Line coverage: **${coverage_percent}%**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Build Android debug APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Generate Android host project
        run: >-
          flutter create
          --platforms=android
          --project-name budget_accounting_system
          --org com.bekodeg
          --no-pub
          .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: budget-accounting-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
