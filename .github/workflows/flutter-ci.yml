name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Generate Drift migration artifacts
        run: dart run drift_dev make-migrations

      - name: Bootstrap Drift schema history
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git add drift_schemas
          if [ -d test/drift ]; then
            git add test/drift
          fi
          find lib/src/data/database -maxdepth 1 -name '*.steps.dart' -print0 |
            xargs -0 -r git add
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: record generated Drift migration artifacts"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Upload Drift migration artifacts
        uses: actions/upload-artifact@v7
        with:
          name: drift-migration-artifacts
          path: |
            drift_schemas/
            test/drift/
            lib/src/data/database/*.steps.dart
          if-no-files-found: warn
          retention-days: 7

      - name: Verify Drift migration artifacts are committed
        shell: bash
        run: |
          changes="$(git status --porcelain -- drift_schemas test/drift lib/src/data/database)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "Drift migration artifacts are not committed."
            exit 1
          fi

      - name: Format sources
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

  build-android:
    name: Build Android debug APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Generate Android host project
        run: >-
          flutter create
          --platforms=android
          --project-name budget_accounting_system
          --org com.bekodeg
          --no-pub
          .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: budget-accounting-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
