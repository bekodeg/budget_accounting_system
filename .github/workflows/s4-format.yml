name: S4 Formatter

on:
  push:
    branches:
      - fix/s4-stage-formatting

permissions:
  contents: write

concurrency:
  group: s4-formatter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: fix/s4-stage-formatting

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Apply Dart formatter
        run: dart format lib test

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- lib test; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "style: apply Dart formatter for S4"
          git push origin HEAD:fix/s4-stage-formatting
