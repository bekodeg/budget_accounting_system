# Liquibase local development configuration for SQLite
# Run from repository root:
#   liquibase update
# Preview SQL without applying:
#   liquibase update-sql

changelogFile: db/changelog/db.changelog-master.xml
url: jdbc:sqlite:./budget-accounting.db
driver: org.sqlite.JDBC

# If the SQLite JDBC driver is not bundled with your Liquibase installation,
# place the JAR under ./lib and uncomment the next line.
# classpath: ./lib/sqlite-jdbc.jar
