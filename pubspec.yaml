name: budget_accounting_system
description: Offline-first household budget accounting application.
publish_to: "none"
version: 0.1.0+2

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.1.0
  excel: ^4.0.6
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  nsd: ^5.0.1
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.1
  google_mlkit_barcode_scanning: ^0.16.0
  google_mlkit_text_recognition: ^0.16.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  sqlite3: ^3.7.0
  archive: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
